workflows:
  ios-testflight:
    name: BantayDengue iOS (TestFlight — smoothest way to test on your iPhone)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bantaydengue.bantayDengue
      vars:
        BUNDLE_ID: "com.bantaydengue.bantayDengue"
        # Set these as encrypted group variables in Codemagic UI (Environment variables > Variable group "supabase")
        # SUPABASE_URL
        # SUPABASE_ANON_KEY
      groups:
        - supabase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Write env.json from encrypted vars
        script: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --dart-define-from-file=env.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - villaramaejay@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users

  # FREE PATH — no Apple Developer Program needed.
  # Builds an unsigned .ipa. Sign + install it yourself on Windows using
  # Sideloadly (sideloadly.io) with a free Apple ID. Re-sign every 7 days
  # (free Apple ID limitation, not a Sideloadly/Codemagic one).
  ios-free-sideload:
    name: BantayDengue iOS (free, unsigned — sideload with Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.bantaydengue.bantayDengue"
        # Set these as encrypted group variables in Codemagic UI (Environment variables > Variable group "supabase")
        # SUPABASE_URL
        # SUPABASE_ANON_KEY
      groups:
        - supabase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Write env.json from encrypted vars
        script: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=env.json
      - name: Package unsigned .ipa
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r ../ipa/BantayDengue-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/BantayDengue-unsigned.ipa
    publishing:
      email:
        recipients:
          - villaramaejay@gmail.com
        notify:
          success: true
          failure: true
